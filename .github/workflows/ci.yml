name: CI

on:
  push:
    branches: [master]
  pull_request:

# 只读权限：CI 不需要写任何东西
permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      # 两个矩阵项都要跑完并各自报告，任一失败仍使整个 check 失败
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7

      # 设置 python-version 会写入 UV_PYTHON，后续 uv 命令据此选择解释器，
      # 缺失时由 uv 自行下载，无需额外的 setup-python 步骤。
      # 注意：该 action 未发布 v8/v9/v10 浮动主标签，故固定到精确版本。
      - name: Install uv and select Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify lockfile agrees with pyproject.toml
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run tests (benchmarks skipped)
        run: uv run pytest --benchmark-skip

  # 下限验证：直接依赖降到各自下限后跑完整测试。
  # 依赖声明只写下限（见 ADR-0010），下限因此是唯一的契约，必须可被证伪。
  #
  # 单独成一个 job 而不是加进上面的矩阵：上面两个 check 名称（test (3.10) /
  # test (3.13)）已被 master 的分支保护引用为必需检查，动矩阵就会改掉这些名称，
  # 使保护配置指向永不出现的 check 而锁死所有 PR。
  lowest-direct:
    name: lowest-direct
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 固定用 3.10：下限指向的旧版本早于 Python 3.13，lxml 5.0.0 没有 cp313
      # 轮子，在 3.13 上会退化成源码编译（需要 libxml2 头文件）。
      - name: Install uv and select Python 3.10
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.10"

      # 注意：--resolution lowest-direct 会重新解析并重写 uv.lock（uv 不支持多份
      # lockfile）。在本 job 中这是预期的，因此这里不能搭配 uv lock --check ——
      # 那会拿「最低」解析出的 lock 去比对「最高」解析的预期结果。
      - name: Run tests against the declared lower bounds
        run: uv run --resolution lowest-direct pytest --benchmark-skip

  # 构建后端门禁：[build-system].requires 必须封顶到下一个 minor（见 ADR-0011）。
  # 这里刻意不钉住 uv 版本（setup-uv 默认装最新），使上游发布新的 uv minor 时本 job
  # 变红 —— 这是金丝雀信号，用来强制同步 bump 上限，而不是缺陷。
  #
  # 两类 warning 都表示 pin 已损坏：「当前 uv 版本不在范围内」（wheel 与 sdist 都报）、
  # 以及「缺少上限」（只在 sdist 路径报）。因此必须用默认的 `uv build` 同时构建两者，
  # 只跑 `--wheel` 会漏掉「上限被删」这种情况。
  # pin 过期时这些 warning 不改变退出码（仍为 0），所以判定依据是输出文本，并先折叠
  # 空白以兼容 uv 对长消息的折行。
  build-backend:
    name: build-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Build and fail on a stale build-backend pin
        run: |
          set -euo pipefail
          output="$(uv build 2>&1)"
          printf '%s\n' "$output"
          flat="$(printf '%s' "$output" | tr '\n' ' ' | tr -s ' ')"
          if grep -Eq 'does not contain the current uv version|is missing an upper bound' <<< "$flat"; then
            echo "::error::[build-system].requires 已与当前 uv 版本脱节；请按 uv CHANGELOG 把上限 bump 到下一个 minor（见 ADR-0011）。"
            exit 1
          fi
