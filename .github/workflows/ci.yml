name: CI

on:
  push:
    branches: [master]
  pull_request:

# 只读权限：CI 不需要写任何东西
permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      # 两个矩阵项都要跑完并各自报告，任一失败仍使整个 check 失败
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7

      # 设置 python-version 会写入 UV_PYTHON，后续 uv 命令据此选择解释器，
      # 缺失时由 uv 自行下载，无需额外的 setup-python 步骤。
      # 注意：该 action 未发布 v8/v9/v10 浮动主标签，故固定到精确版本。
      - name: Install uv and select Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify lockfile agrees with pyproject.toml
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run tests (benchmarks skipped)
        run: uv run pytest --benchmark-skip

  # 下限验证：直接依赖降到各自下限后跑完整测试。
  # 依赖声明只写下限（见 ADR-0010），下限因此是唯一的契约，必须可被证伪。
  #
  # 单独成一个 job 而不是加进上面的矩阵：上面两个 check 名称（test (3.10) /
  # test (3.13)）已被 master 的分支保护引用为必需检查，动矩阵就会改掉这些名称，
  # 使保护配置指向永不出现的 check 而锁死所有 PR。
  lowest-direct:
    name: lowest-direct
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 固定用 3.10：下限指向的旧版本早于 Python 3.13，lxml 5.0.0 没有 cp313
      # 轮子，在 3.13 上会退化成源码编译（需要 libxml2 头文件）。
      - name: Install uv and select Python 3.10
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.10"

      # 注意：--resolution lowest-direct 会重新解析并重写 uv.lock（uv 不支持多份
      # lockfile）。在本 job 中这是预期的，因此这里不能搭配 uv lock --check ——
      # 那会拿「最低」解析出的 lock 去比对「最高」解析的预期结果。
      - name: Run tests against the declared lower bounds
        run: uv run --resolution lowest-direct pytest --benchmark-skip
